<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Катализатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: шкала TRL как главный образ страницы; ниже проекты ученых, задачи бизнеса, участники, два сценария и формы публикации. Два языка: қазақша / русский. Профили, проекты, задачи и предложения хранятся в db */
:root {
  --bg: #EDF2F3;
  --surface: #FFFFFF;
  --ink: #0F2229;
  --muted: #566A73;
  --line: #CFDCE0;
  --accent: #0A6B5D;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6EBE6;
  --bar: #9DB3BB;
  --bar-end: #0F2229;
  --warn: #B45309;
  --warn-soft: #F5E4CC;
  --shadow: 0 12px 40px rgba(15, 34, 41, .18);
  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C181D; --surface: #13252C; --ink: #E4EEF1; --muted: #8FA6AF; --line: #25414A;
    --accent: #3FD0B4; --accent-ink: #06211C; --accent-soft: #123B35;
    --bar: #3B5963; --bar-end: #E4EEF1; --warn: #F0B25E; --warn-soft: #3A2C14;
    --shadow: 0 12px 40px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C181D; --surface: #13252C; --ink: #E4EEF1; --muted: #8FA6AF; --line: #25414A;
  --accent: #3FD0B4; --accent-ink: #06211C; --accent-soft: #123B35;
  --bar: #3B5963; --bar-end: #E4EEF1; --warn: #F0B25E; --warn-soft: #3A2C14;
  --shadow: 0 12px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 0;
}
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 12px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-decoration: none; letter-spacing: -.01em; margin-right: auto; }
.brand i { font-style: normal; color: var(--accent); }
.nav { display: flex; gap: 4px 18px; flex-wrap: wrap; align-items: center; }
.nav a { text-decoration: none; font-size: 14px; color: var(--muted); padding-block: 4px; }
.nav a:hover { color: var(--ink); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: none; padding: 6px 12px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.favbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-size: 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; max-width: 100%;
}
.favbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.favbtn b { font-family: var(--f-mono); font-weight: 500; }
.acct { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.acct span { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* hero */
.hero { padding-block: 40px 28px; display: grid; gap: 28px; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.45rem, 4vw, 2.3rem); line-height: 1.2; letter-spacing: -.01em; max-width: 30ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.lead { max-width: 60ch; color: var(--muted); font-size: 17px; margin-top: 16px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  padding: 11px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.ghost:hover { background: var(--surface); filter: none; }
.btn.danger { background: transparent; color: var(--warn); border-color: var(--warn); }

/* TRL ladder */
.ladder-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
.ladder-head { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; align-items: baseline; }
.ladder-head h2 { font-family: var(--f-display); font-weight: 500; font-size: 15px; line-height: 1.4; }
.ladder { position: relative; height: 250px; }
.ladder-grid, .valley-layer { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; height: 100%; }
.valley-layer { position: absolute; inset: 0 0 30px 0; pointer-events: none; height: auto; }
.valley {
  grid-column: 4 / 8; border: 1px dashed var(--warn); border-radius: 6px;
  background: repeating-linear-gradient(135deg, var(--warn-soft) 0 6px, transparent 6px 12px);
  padding: 6px 8px;
}
.valley span { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); background: var(--surface); padding: 1px 6px; border-radius: 4px; }
.step { display: flex; flex-direction: column; justify-content: flex-end; border: 0; background: none; padding: 0; cursor: pointer; min-width: 0; position: relative; }
.step .col { height: calc((100% - 30px) * var(--h)); background: var(--bar); border-radius: 4px 4px 0 0; transition: filter .15s; }
.step.mid .col { background: var(--accent); }
.step.end .col { background: var(--bar-end); }
.step .num { height: 30px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.step:hover .col { filter: brightness(1.12); }
.step[aria-pressed="true"] .num { color: var(--ink); font-weight: 500; }
.step[aria-pressed="true"] .col { outline: 2px solid var(--ink); outline-offset: 2px; }
.ladder-cap { min-height: 6.4em; border-top: 1px solid var(--line); padding-top: 14px; }
.ladder-cap h3 { font-size: 15px; font-weight: 600; }
.ladder-cap p { color: var(--muted); font-size: 15px; margin-top: 4px; max-width: 72ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--bar); }
.legend .m::before { background: var(--accent); }
.legend .e::before { background: var(--bar-end); }

/* sections */
section { padding-block: 44px; }
.sec-head { display: grid; gap: 8px; margin-bottom: 22px; }
.sec-head h2, .h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.35rem, 3.2vw, 1.9rem); letter-spacing: -.015em; line-height: 1.2; }
.sec-head p { color: var(--muted); max-width: 64ch; }
.demo-note { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; }

/* filters */
.filters { display: grid; gap: 12px; margin-bottom: 20px; }
.frow { display: flex; flex-wrap: wrap; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; flex: 1 1 200px; }
.field label, .lbl { font-size: 12px; color: var(--muted); font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
input[type="text"], input[type="email"], input[type="number"], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0;
}
textarea { resize: vertical; min-height: 110px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.badge { font-family: var(--f-mono); font-size: 11px; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 6px; letter-spacing: 0; text-transform: none; }
.badge.mine { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.star { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; padding: 4px; color: var(--muted); }
.star[aria-pressed="true"] { color: var(--accent); }
.card h3 { font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.card h3 button { all: unset; cursor: pointer; }
.card h3 button:hover { text-decoration: underline; }
.card h3 button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card .sum { color: var(--muted); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.meter { display: grid; gap: 6px; }
.meter-row { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--muted); gap: 8px; }
.segs { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
.segs i { height: 8px; border-radius: 2px; background: var(--line); }
.segs i.on { background: var(--accent); }
.fund { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fund i { display: block; height: 100%; background: var(--ink); }
.card-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.card-foot b { color: var(--ink); font-weight: 600; }
.budget { font-family: var(--f-mono); font-size: 14px; color: var(--ink); }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 32px 16px; text-align: center; color: var(--muted); grid-column: 1 / -1; display: grid; gap: 14px; justify-items: center; }
.sec-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: end; }
.sec-tools .field { flex: 0 1 260px; }

/* people */
.inv { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.inv h3 { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.inv .org { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.inv .about { font-size: 15px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; color: var(--muted); }
.cheque { font-family: var(--f-mono); font-size: 13px; }

/* scenarios */
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.role { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.role h3 { font-family: var(--f-display); font-weight: 500; font-size: 18px; line-height: 1.3; }
.role > p { color: var(--muted); font-size: 15px; }
.role ol { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 14px; }
.role li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
.role li::before { content: counter(s); font-family: var(--f-mono); width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-size: 13px; }
.role li b { display: block; font-weight: 600; }
.role li span { color: var(--muted); font-size: 15px; }

/* forms */
.form-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 28px; align-items: start; }
.form-side p { color: var(--muted); margin-top: 10px; max-width: 48ch; }
form.submit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.formbox { display: grid; gap: 12px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 14px; }
.hint { font-size: 13px; color: var(--muted); }
.err { font-size: 14px; color: var(--warn); min-height: 1.2em; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; background: var(--surface); }
.opt input { width: auto; margin: 0; accent-color: var(--accent); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { padding: 0; }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 18, 22, .6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 680px; max-height: 92%; overflow: auto; border-radius: 16px 16px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); display: grid; gap: 16px; }
@media (min-width: 720px) { .overlay { align-items: center; padding: 24px; } .sheet { border-radius: 16px; } }
.sheet-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; line-height: 1.25; overflow-wrap: anywhere; }
.sheet h3 { font-size: 15px; font-weight: 600; }
.x { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 38px; height: 38px; cursor: pointer; font-size: 18px; flex: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.fact small { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fact b { font-family: var(--f-mono); font-weight: 500; font-size: 14px; }
.next { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.next b { display: block; font-size: 12px; font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.sheet p.body { overflow-wrap: anywhere; }
.notice { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.pform { display: grid; gap: 14px; }
.linkrow { display: flex; gap: 8px; flex-wrap: wrap; }
.linkrow input { flex: 1 1 220px; font-family: var(--f-mono); font-size: 13px; }
a.opt { text-decoration: none; color: var(--ink); }
a.opt:hover { border-color: var(--accent); }
.offers { display: grid; gap: 10px; }
.offer { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.offer b { font-weight: 600; }
.offer small { color: var(--muted); }
.offer p { font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; max-width: min(92vw, 460px); font-size: 14px; box-shadow: var(--shadow); }
footer { border-top: 1px solid var(--line); padding-block: 28px 36px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

@media (max-width: 520px) {
  .ladder { height: 210px; }
  .ladder-box { padding: 14px; }
  .valley span { font-size: 9px; padding: 0 3px; }
  .nav { display: none; }
}
.road { display: grid; gap: 10px; margin: 0 0 22px; padding: 0; list-style: none; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); counter-reset: rd; }
.road li { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 14px 14px; background: var(--surface); counter-increment: rd; }
.road li::before { content: counter(rd); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 600 12px var(--f-mono, monospace); margin-bottom: 8px; }
.road li.cur { border-color: var(--accent); }
.road b { display: block; font-family: var(--f-display); font-size: 14px; margin-bottom: 4px; }
.road span { font-size: 13px; color: var(--muted); line-height: 1.45; display: block; }
.ipo-aud { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 0 0 18px; }
.ipo-aud div { border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
.ipo-aud b { display: block; margin-bottom: 4px; }
.ipo-links { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks li i { font-style: normal; flex: none; width: 18px; text-align: center; color: var(--muted); }
.checks li.ok i { color: var(--accent); }
.legal { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 14px; }
.aud { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .aud { grid-template-columns: minmax(300px, 430px) 1fr; } }
.pyr { width: 100%; height: auto; display: block; max-width: 460px; margin-inline: auto; }
.pyr [data-el] { cursor: pointer; }
.pyr text { pointer-events: none; }
.elinfo { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface); display: grid; gap: 6px; font-size: 14px; }
.elinfo h3 { font-family: var(--f-display); font-size: 15px; }
.mrow { display: grid; grid-template-columns: minmax(110px, 1fr) 2fr 3ch; gap: 10px; align-items: center; font-size: 14px; padding-block: 3px; }
.mrow input { width: 100%; accent-color: var(--accent); }
.mrow output { font-family: var(--f-mono); text-align: right; }
details.man { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--surface); margin: 12px 0; }
details.man summary { cursor: pointer; font-weight: 600; }
.aout { display: grid; gap: 12px; margin-top: 14px; }
.aout h3 { font-family: var(--f-display); font-size: 15px; margin-top: 4px; }
.pitch { border-left: 4px solid var(--accent); padding: 8px 14px; background: var(--accent-soft); border-radius: 0 10px 10px 0; white-space: pre-wrap; font-size: 15px; }
.chatlog { display: grid; gap: 8px; margin: 12px 0; max-height: 42vh; overflow: auto; }
.bub { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--surface); }
.bub.me { background: var(--accent-soft); }
.bub small { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }

    else if (text.length < 30) err = t('oErr');
    $('o-err').textContent = err;
    if (err || dbState !== 'ready') return;
    var key = p.key;
    write(function () {
      var cur = itemsOf('offers', uid).filter(function (o) { return o && o.pk !== key; });
      cur.push({ pk: key, text: text, created: Date.now() });
      return db.doc('offers/' + uid).set({ items: cur.slice(-50) }).then(function () {
        offerDraft = null;
        toast(t('oSent'));
        if (mode === 'problem' && openKey === key) renderProblem();
      });
    });
  }

  function currentDraft() {
    var pr = myProfile() || {};
    return {
      role: pr.role || '', name: pr.name || '', org: pr.org || '', about: pr.about || '',
      fields: Array.isArray(pr.fields) ? pr.fields.slice() : [],
      min: pr.chequeMin != null ? pr.chequeMin : '', max: pr.chequeMax != null ? pr.chequeMax : '',
      invType: pr.invType === 'inst' || pr.invType === 'retail' ? pr.invType : ''
    };
  }
  function renderProfile() {
    if (!draft) draft = currentDraft();
    var d = draft;
    var notes = [];
    if (noticeKey) notes.push(t(noticeKey));
    if (dbState === 'off') notes.push(t('noDb'));
    else if (canWrite === false) notes.push(t('noWrite'));
    var off = dbState !== 'ready';
    var hasProfile = !!myProfile();
    $('sheet').innerHTML =
      '<div class="sheet-top"><h2 id="s-title">' + esc(t('pTitle')) + '</h2><button type="button" class="x" id="s-close" aria-label="' + esc(t('close')) + '">✕</button></div>' +
      '<p class="hint">' + esc(t('pIntro')) + '</p>' +
      notes.map(function (n) { return '<p class="notice">' + esc(n) + '</p>'; }).join('') +
      '<form class="pform" id="pform" novalidate>' +
        '<fieldset><legend class="lbl">' + esc(t('pRole')) + '</legend><div class="opts">' +
          '<label class="opt"><input type="radio" name="role" value="scientist"' + (d.role === 'scientist' ? ' checked' : '') + '> ' + esc(t('roleSci')) + '</label>' +
          '<label class="opt"><input type="radio" name="role" value="investor"' + (d.role === 'investor' ? ' checked' : '') + '> ' + esc(t('roleInv')) + '</label>' +
        '</div></fieldset>' +
        '<div class="field"><label for="p-name">' + esc(t('pName')) + '</label><input type="text" id="p-name" maxlength="80" value="' + esc(d.name) + '"></div>' +
        '<div class="field"><label for="p-org">' + esc(t('pOrg')) + '</label><input type="text" id="p-org" maxlength="80" value="' + esc(d.org) + '"></div>' +
        '<div class="field"><label for="p-about">' + esc(t('pAbout')) + '</label><textarea id="p-about" maxlength="400">' + esc(d.about) + '</textarea><span class="hint">' + esc(t('pAboutHint')) + '</span></div>' +
        '<fieldset id="p-fields"' + (d.role ? '' : ' hidden') + '><legend class="lbl" id="p-fl">' + esc(t(d.role === 'scientist' ? 'pFieldsSci' : 'pFieldsInv')) + '</legend><div class="opts">' +
          FIELD_IDS.map(function (f) { return '<label class="opt"><input type="checkbox" name="pf" value="' + f + '"' + (d.fields.indexOf(f) >= 0 ? ' checked' : '') + '> ' + esc(fieldName(f)) + '</label>'; }).join('') +
        '</div></fieldset>' +
        '<fieldset id="p-it"' + (d.role === 'investor' ? '' : ' hidden') + '><legend class="lbl">' + esc(t('pInvType')) + '</legend><div class="opts">' +
          '<label class="opt"><input type="radio" name="invType" value="inst"' + (d.invType === 'inst' ? ' checked' : '') + '> ' + esc(t('pInvInst')) + '</label>' +
          '<label class="opt"><input type="radio" name="invType" value="retail"' + (d.invType === 'retail' ? ' checked' : '') + '> ' + esc(t('pInvRet')) + '</label>' +
        '</div></fieldset>' +
        '<div id="p-chq" class="two"' + (d.role === 'investor' ? '' : ' hidden') + '>' +
          '<div class="field"><label for="p-min">' + esc(t('pCheque')) + ': ' + esc(t('pFrom')) + '</label><input type="number" id="p-min" min="0" max="100000" step="1" inputmode="numeric" value="' + esc(d.min) + '"></div>' +
          '<div class="field"><label for="p-max">' + esc(t('pCheque')) + ': ' + esc(t('pTo')) + '</label><input type="number" id="p-max" min="0" max="100000" step="1" inputmode="numeric" value="' + esc(d.max) + '"></div>' +
        '</div>' +
        '<span class="err" id="p-err" role="alert"></span>' +
        '<div class="sheet-actions"><button type="submit" class="btn"' + (off ? ' disabled' : '') + '>' + esc(t('pSave')) + '</button>' +
          (hasProfile ? '<button type="button" class="btn danger" data-act="pdel">' + esc(confirmKey === 'prof' ? t('pDeleteSure') : t('pDelete')) + '</button>' : '') +
          '<button type="button" class="btn ghost" id="s-close2">' + esc(t('close')) + '</button></div>' +
      '</form>';
    $('s-close').onclick = $('s-close2').onclick = closeSheet;
  }

  function readDraft() {
    var f = $('pform');
    if (!f || mode !== 'profile') return;
    var r = f.querySelector('input[name="role"]:checked');
    draft = {
      role: r ? r.value : '', name: $('p-name').value, org: $('p-org').value, about: $('p-about').value,
      fields: Array.prototype.map.call(f.querySelectorAll('input[name="pf"]:checked'), function (c) { return c.value; }),
      min: $('p-min').value, max: $('p-max').value,
      invType: (f.querySelector('input[name="invType"]:checked') || {}).value || ''
    };
    $('p-fields').hidden = !draft.role;
    $('p-it').hidden = draft.role !== 'investor';
    $('p-fl').textContent = t(draft.role === 'scientist' ? 'pFieldsSci' : 'pFieldsInv');
    $('p-chq').hidden = draft.role !== 'investor';
  }
  function saveProfile() {
    readDraft();
    var d = draft, err = '';
    var min = d.min === '' ? 0 : num(d.min, NaN), max = d.max === '' ? 0 : num(d.max, NaN);
    if (!d.role) err = t('pErrRole');
    else if (!d.name.trim()) err = t('pErrName');
    else if (d.role === 'investor' && (isNaN(min) || isNaN(max) || min < 0 || max < min)) err = t('pErrCheque');
    $('p-err').textContent = err;
    if (err || dbState !== 'ready') return;
    var doc = {
      role: d.role, name: d.name.trim().slice(0, 80), org: d.org.trim().slice(0, 80), about: d.about.trim().slice(0, 400),
      fields: d.fields.filter(function (f) { return FIELDS[f]; }),
      chequeMin: d.role === 'investor' ? min : 0, chequeMax: d.role === 'investor' ? max : 0,
      invType: d.role === 'investor' && (d.invType === 'inst' || d.invType === 'retail') ? d.invType : '', updated: Date.now()
    };
    write(function () {
      return db.doc('profiles/' + uid).set(doc).then(function () { closeSheet(); toast(t('pSaved')); });
    });
  }

  $('sheet').addEventListener('input', function (e) {
    if (mode === 'profile') readDraft();
    else if (mode === 'problem' && e.target && e.target.id === 'o-text') offerDraft = e.target.value;
  });
  $('sheet').addEventListener('change', function () { if (mode === 'profile') readDraft(); });
  $('sheet').addEventListener('submit', function (e) {
    e.preventDefault();
    if (mode === 'profile') saveProfile();
    else if (mode === 'problem') saveOffer();
    else if (mode === 'agent') sendAgent(null);
  });
  $('sheet').addEventListener('click', function (e) {
    var reg2 = e.target.closest('[data-act="reg2"]');
    if (reg2 && (mode === 'problem' || mode === 'company')) { var k = openKey; openProfile('needReg', null); lastFocus = null; return; }
    var b = e.target.closest('[data-act="pdel"]');
    if (!b || mode !== 'profile') return;
    if (confirmKey !== 'prof') { readDraft(); confirmKey = 'prof'; renderProfile(); var again = $('sheet').querySelector('[data-act="pdel"]'); if (again) again.focus(); return; }
    confirmKey = '';
    write(function () {
      return db.doc('profiles/' + uid).delete()
        .then(function () { return db.doc('interest/' + uid).delete(); })
        .then(function () { return db.doc('offers/' + uid).delete(); })
        .then(function () { return db.doc('ipoint/' + uid).delete(); })
        .then(function () { closeSheet(); toast(t('pDeleted')); });
    });
  });

  var SHARE_URL = 'https://claude.ai/artifact/SVmqbtNYoFNtjXzkM3ZH1C';
  function renderShare() {
    var u = encodeURIComponent(SHARE_URL), tx = encodeURIComponent(t('shText'));
    var links = [
      ['Telegram', 'https://t.me/share/url?url=' + u + '&text=' + tx],
      ['WhatsApp', 'https://wa.me/?text=' + tx + '%20' + u],
      ['Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + u],
      ['X', 'https://twitter.com/intent/tweet?url=' + u + '&text=' + tx],
      ['VK', 'https://vk.com/share.php?url=' + u + '&title=' + tx]
    ];
    $('sheet').innerHTML =
      '<div class="sheet-top"><h2 id="s-title">' + esc(t('shTitle')) + '</h2><button type="button" class="x" id="s-close" aria-label="' + esc(t('close')) + '">✕</button></div>' +
      '<div class="field"><label for="sh-url">' + esc(t('shLink')) + '</label><div class="linkrow"><input type="text" id="sh-url" readonly value="' + esc(SHARE_URL) + '"><button type="button" class="btn" data-act="copy">' + esc(t('shCopy')) + '</button></div></div>' +
      '<div class="field"><span class="lbl">' + esc(t('shVia')) + '</span><div class="opts">' +
        links.map(function (l) { return '<a class="opt" href="' + esc(l[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(l[0]) + '</a>'; }).join('') +
      '</div></div>' +
      '<p class="notice">' + esc(t('shHint')) + ' ' + esc(t('shHint2')) + '</p>' +
      '<div class="sheet-actions"><button type="button" class="btn ghost" id="s-close2">' + esc(t('close')) + '</button></div>';
    $('s-close').onclick = $('s-close2').onclick = closeSheet;
  }
  $('sheet').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act="copy"]');
    if (!b || mode !== 'share') return;
    var inp = $('sh-url');
    function manual() { inp.focus(); inp.select(); toast(t('shManual')); }
    try {
      navigator.clipboard.writeText(SHARE_URL).then(function () { toast(t('shCopied')); }, manual);
    } catch (err) { manual(); }
  });
  $('shareBtn').addEventListener('click', function () { mode = 'share'; renderSheet(); showSheet($('shareBtn')); });

  function renderSheet() {
    if (mode === 'profile') renderProfile();
    else if (mode === 'project') renderProject();
    else if (mode === 'problem') renderProblem();
    else if (mode === 'company') renderCompany();
    else if (mode === 'agent') renderAgent();
    else if (mode === 'share') renderShare();
  }
  function showSheet(trigger) {
    lastFocus = trigger;
    $('overlay').hidden = false;
    document.documentElement.style.overflow = 'hidden';
    $('s-close').focus();
  }
  function openProject(key, trigger) { mode = 'project'; openKey = key; confirmKey = ''; renderSheet(); showSheet(trigger); }
  function openProblem(key, trigger) { mode = 'problem'; openKey = key; confirmKey = ''; offerDraft = null; renderSheet(); showSheet(trigger); }
  function openCompany(key, trigger) { mode = 'company'; openKey = key; confirmKey = ''; renderSheet(); showSheet(trigger); }
  function openProfile(notice, trigger) { mode = 'profile'; noticeKey = notice || ''; draft = null; confirmKey = ''; renderSheet(); showSheet(trigger || $('acctBtn')); }
  function closeSheet() {
    $('overlay').hidden = true;
    document.documentElement.style.overflow = '';
    if (agCtl) agCtl.abort();
    agentOpen = null;
    mode = null; openKey = null; draft = null; noticeKey = ''; confirmKey = ''; offerDraft = null;
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('overlay').hidden) closeSheet();
  });
  $('acctBtn').addEventListener('click', function () { openProfile('', $('acctBtn')); });

  /* ---------- toast ---------- */
  var tt;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(tt);
    tt = setTimeout(function () { el.hidden = true; }, 5000);
  }

  /* ---------- publish forms ---------- */
  function buildSelects() {
    var fv = $('f-field').value, tv = $('f-trl').value, gv = $('g-field').value, cv = $('c-field').value;
    var opts = '<option value="">' + esc(t('choose')) + '</option>' + FIELD_IDS.map(function (f) { return '<option value="' + f + '">' + esc(fieldName(f)) + '</option>'; }).join('');
    $('f-field').innerHTML = opts;
    $('g-field').innerHTML = opts;
    $('c-field').innerHTML = opts;
    var chk = Array.prototype.map.call($('c-ready').querySelectorAll('input:checked'), function (x) { return x.value; });
    $('c-ready').innerHTML = [0, 1, 2, 3, 4, 5].map(function (i) { return '<label class="opt"><input type="checkbox" name="cr" value="' + i + '"' + (chk.indexOf(String(i)) >= 0 ? ' checked' : '') + '> ' + esc(t('rc' + (i + 1))) + '</label>'; }).join('');
    $('f-trl').innerHTML = '<option value="">' + esc(t('choose')) + '</option>' + TRLS[lang].map(function (x, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + ' · ' + esc(x[0]) + '</option>'; }).join('');
    $('f-field').value = fv; $('f-trl').value = tv; $('g-field').value = gv; $('c-field').value = cv;
  }
  function updateSubTab() {
    Array.prototype.forEach.call($('subTabs').querySelectorAll('[data-tab]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-tab') === state.subTab); });
    $('form').hidden = state.subTab !== 'proj';
    $('form2').hidden = state.subTab !== 'prob';
    $('form3').hidden = state.subTab !== 'comp';
    $('subP1').textContent = t(state.subTab === 'proj' ? 'subP1' : (state.subTab === 'prob' ? 'subP1b' : 'subP1c'));
  }
  $('subTabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    state.subTab = b.getAttribute('data-tab');
    updateSubTab();
  });

  function resetFilters() {
    state.field = 'all'; state.q = ''; state.stage = 'all'; state.favOnly = false; state.sort = 'new'; state.prField = 'all';
    $('q').value = ''; $('stage').value = 'all'; $('sort').value = 'new'; $('prField').value = 'all';
    renderChips();
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = this;
    var title = $('f-title').value.trim(), field = $('f-field').value, trl = +$('f-trl').value,
        need = +$('f-need').value, city = $('f-city').value.trim(), sum = $('f-sum').value.trim();
    var err = '';
    if (dbState !== 'ready') err = t('noDb');
    else if (!myProfile()) { $('f-err').textContent = ''; openProfile('needReg', $('f-btn')); return; }
    else if (myProfile().role !== 'scientist') err = t('e7');
    else if (!title) err = t('e1');
    else if (!field) err = t('e2');
    else if (!trl) err = t('e3');
    else if (!(need >= 1)) err = t('e4');
    else if (!city) err = t('e5');
    else if (sum.length < 30) err = t('e6');
    if (!err && itemsOf('projects', uid).length >= 20) err = t('e8');
    $('f-err').textContent = err;
    if (err) return;
    var item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: title, field: field, trl: trl, need: need, raised: 0, city: city, sum: sum, team: 1, months: 12, created: Date.now() };
    write(function () {
      var cur = itemsOf('projects', uid).slice();
      cur.push(item);
      return db.doc('projects/' + uid).set({ items: cur }).then(function () {
        form.reset();
        resetFilters(); refreshAll();
        toast(t('toastAdded'));
        $('projects').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  });

  $('form2').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = this;
    var title = $('g-title').value.trim(), field = $('g-field').value, budget = +$('g-budget').value,
        city = $('g-city').value.trim(), sum = $('g-sum').value.trim();
    var err = '';
    if (dbState !== 'ready') err = t('noDb');
    else if (!myProfile()) { $('g-err').textContent = ''; openProfile('needReg', $('g-btn')); return; }
    else if (myProfile().role !== 'investor') err = t('e10');
    else if (!title) err = t('e12');
    else if (!field) err = t('e2');
    else if (!(budget >= 1)) err = t('e9');
    else if (!city) err = t('e5');
    else if (sum.length < 30) err = t('e13');
    if (!err && itemsOf('problems', uid).length >= 20) err = t('e11');
    $('g-err').textContent = err;
    if (err) return;
    var item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: title, field: field, budget: budget, city: city, sum: sum, created: Date.now() };
    write(function () {
      var cur = itemsOf('problems', uid).slice();
      cur.push(item);
      return db.doc('problems/' + uid).set({ items: cur }).then(function () {
        form.reset();
        resetFilters(); refreshAll();
        toast(t('toastProb'));
        $('problems').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  });

  $('form3').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = this;
    var title = $('c-title').value.trim(), field = $('c-field').value, city = $('c-city').value.trim(), sum = $('c-sum').value.trim();
    var rev = $('c-rev').value === '' ? NaN : +$('c-rev').value, raise = +$('c-raise').value;
    var ready = Array.prototype.map.call($('c-ready').querySelectorAll('input:checked'), function (x) { return +x.value; });
    var err = '';
    if (dbState !== 'ready') err = t('noDb');
    else if (!myProfile()) { $('c-err').textContent = ''; openProfile('needReg', $('c-btn')); return; }
    else if (!title) err = t('e16');
    else if (!field) err = t('e2');
    else if (isNaN(rev) || rev < 0 || !(raise >= 1)) err = t('e17');
    else if (!city) err = t('e5');
    else if (sum.length < 30) err = t('e18');
    if (!err && itemsOf('companies', uid).length >= 20) err = t('e15');
    $('c-err').textContent = err;
    if (err) return;
    var item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: title, field: field, revenue: rev, raise: raise, ready: ready, city: city, sum: sum, created: Date.now() };
    write(function () {
      var cur = itemsOf('companies', uid).slice();
      cur.push(item);
      return db.doc('companies/' + uid).set({ items: cur }).then(function () {
        form.reset();
        refreshAll();
        toast(t('toastCo'));
        $('ipo').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  });

  /* ---------- account UI ---------- */
  function updateAcct() {
    var pr = myProfile();
    $('acctTxt').textContent = pr ? pr.name : t('reg');
    $('acctBtn').title = pr ? (pr.role === 'investor' ? t('roleInv') : t('roleSci')) : '';
    var note = $('dbNote');
    var msg = dbState === 'off' ? t('noDb') : (dbState === 'ready' && canWrite === false ? t('noWrite') : '');
    note.hidden = !msg; note.textContent = msg;
  }
  function refreshAll() {
    computeCounts();
    updateAcct(); updateFavUI(); renderGrid(); renderProblems(); renderCompanies(); renderPeople(); fillPicks(); updateAiNote();
    if (mode === 'project') renderProject();
    else if (mode === 'company') renderCompany();
    else if (mode === 'problem') {
      var ae = document.activeElement;
      if (!(ae && ae.id === 'o-text')) renderProblem();
    }
  }

  /* ---------- language ---------- */
  function applyLang() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t(el.getAttribute('data-t')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-th]'), function (el) { el.innerHTML = t(el.getAttribute('data-th')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tp]'), function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-tp'))); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang); });
    $('f-err').textContent = ''; $('g-err').textContent = ''; $('c-err').textContent = '';
    renderLadder(); renderRoad(); renderChips(); buildSelects(); buildProbField(); updateSubTab(); buildManual(); renderAudit(); renderAgents(); renderMeet(); applyBig(); refreshAll();
    if (mode === 'profile') { readDraft(); renderProfile(); } else if (mode === 'share') renderShare(); else if (mode === 'agent') renderAgent();
  }
  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]');
    if (!b || b.getAttribute('data-lang') === lang) return;
    lang = b.getAttribute('data-lang');
    try { localStorage.setItem('katalizator-lang', lang); } catch (err) {}
    applyLang();
  });

  /* ---------- storage ---------- */
  function mapDocs(snap) {
    var o = {};
    snap.docs.forEach(function (d) { o[d.id] = d.data() || {}; });
    return o;
  }
  function subscribe(path, key) {
    db.collection(path).onSnapshot(function (snap) {
      data[key] = mapDocs(snap);
      refreshAll();
    }, function (e) {
      if (e && e.code === 'revoked') { dbState = 'off'; refreshAll(); }
    });
  }
  function init() {
    var c = window.claude;
    if (!c || !c.use) { dbState = 'off'; aiState = 'off'; refreshAll(); return; }
    c.use('sample').then(function (sm) { sampleFn = sm || null; aiState = sm ? 'on' : 'off'; updateAiNote(); if (mode === 'agent') renderAgent(); }).catch(function () { aiState = 'off'; updateAiNote(); });
    Promise.all([c.use('db'), c.use('user')]).then(function (r) {
      var d = r[0], u = r[1];
      if (!d || !u) { dbState = 'off'; refreshAll(); return null; }
      return Promise.all([u.id(), u.can('data.write')]).then(function (v) {
        if (!v[0]) { dbState = 'off'; refreshAll(); return; }
        db = d; uid = v[0]; canWrite = v[1]; dbState = 'ready';
        ['profiles', 'projects', 'interest', 'problems', 'offers', 'companies', 'ipoint'].forEach(function (k) { subscribe(k, k); });
        refreshAll();
      });
    }).catch(function () { dbState = 'off'; refreshAll(); });
  }

  applyLang();
  init();
})();
</script>
